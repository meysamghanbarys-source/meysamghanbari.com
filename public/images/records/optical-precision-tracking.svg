<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Optical pointing and tracking precision</title><desc id="d">Fine steering crosshairs lock a narrow optical beam onto a moving satellite.</desc><defs><radialGradient id="r"><stop stop-color="#12324a"/><stop offset=".68" stop-color="#06111f"/><stop offset="1" stop-color="#02060c"/></radialGradient><filter id="g"><feGaussianBlur stdDeviation="10"/></filter></defs><rect width="1200" height="700" fill="url(#r)"/><g transform="translate(770 345)" fill="none" stroke="#6be5ff"><circle r="184" opacity=".16"/><circle r="118" opacity=".3"/><circle r="52" opacity=".55"/><path d="M-240 0h480M0-240v480" opacity=".2"/><path d="M-28 0h56M0-28v56" stroke-width="2"/></g><circle cx="770" cy="345" r="13" fill="#e4fbff"/><circle cx="742" cy="327" r="26" fill="#65e5ff" opacity=".15" filter="url(#g)"/><path d="M90 610L742 327" stroke="#65e5ff" stroke-width="18" opacity=".12" filter="url(#g)"/><path d="M90 610L742 327" stroke="#65e5ff" stroke-width="3"/><g transform="translate(75 520)" fill="none" stroke="#dffaff" stroke-width="6"><path d="M0 95h120M18 95l42-91 42 91M42 53h37"/><circle cx="60" cy="6" r="4" fill="#dffaff"/></g><g fill="#e5faff" font-family="system-ui,sans-serif"><text x="65" y="78" fill="#6ee8ff" font-size="15" letter-spacing="5">POINTING · ACQUISITION · TRACKING</text><text x="65" y="130" font-size="46" font-weight="700">MICRORADIAN CONTROL</text><text x="65" y="170" fill="#8da8ba" font-size="17">Report the loop, the power floor and the platform—not one isolated number.</text></g><g transform="translate(790 510)" font-family="system-ui,sans-serif"><text fill="#6ee8ff" font-size="12" letter-spacing="3">ERROR ENVELOPE</text><text y="45" fill="#edfaff" font-size="35" font-weight="700">μrad</text><text y="77" fill="#89a4b8" font-size="14">mean · 3σ · received power</text></g></svg>
