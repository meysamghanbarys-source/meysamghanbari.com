<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Long-range optical power beaming</title><desc id="d">A controlled laser beam delivers energy to a remote photovoltaic receiver.</desc><defs><linearGradient id="b" y2="1"><stop stop-color="#0e2531"/><stop offset="1" stop-color="#02070c"/></linearGradient><linearGradient id="l"><stop stop-color="#83ffbd"/><stop offset="1" stop-color="#ffcb74"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="1200" height="700" fill="url(#b)"/><path d="M0 620c250-70 530-70 760 0 180 50 310 48 440 8v72H0z" fill="#102a2a"/><path d="M165 535L970 250" stroke="#88ffc0" stroke-width="38" opacity=".12" filter="url(#g)"/><path d="M165 535L970 250" stroke="url(#l)" stroke-width="5"/><g transform="translate(85 470)" fill="none" stroke="#eafff0" stroke-width="7"><path d="M0 112h150M22 112l52-105 52 105M46 65h58"/><path d="M74 7l54-10"/></g><g transform="translate(900 205)"><path d="M0 0h135l-20 92H20z" fill="#102e3e" stroke="#91ffc6" stroke-width="4"/><path d="M45 92l-14 80M91 92l16 80M17 135h105" stroke="#dfffe9" stroke-width="6"/><g stroke="#91ffc6" opacity=".35"><path d="M12 30h116M7 60h116M44 3l-15 86M83 3L68 89"/></g></g><g fill="#edfff4" font-family="system-ui,sans-serif"><text x="60" y="76" fill="#8fffc4" font-size="15" letter-spacing="5">OPTICAL ENERGY TRANSFER</text><text x="60" y="128" font-size="46" font-weight="700">POWER ACROSS FREE SPACE</text><text x="60" y="168" fill="#94adab" font-size="17">Delivered watts · range · duration · conversion path</text><g transform="translate(610 500)"><rect width="500" height="112" fill="#061712" stroke="#8fffc4" stroke-opacity=".35"/><text x="24" y="38" fill="#90ffc5" font-size="12" letter-spacing="3">DO NOT CONFLATE</text><text x="24" y="73" font-size="18">transmitted optical power ≠ delivered electric power</text><text x="24" y="98" fill="#819f97" font-size="13">Efficiency belongs beside the record when published.</text></g></g></svg>
