const frame=document.getElementById('frame'),wrap=document.getElementById('wrap'),report=document.getElementById('report');
function fit(){const width=+document.getElementById('width').value;frame.style.width=width+'px';frame.style.height='700px';const scale=Math.min(1,(innerWidth-30)/width);frame.style.transform='scale('+scale+')';wrap.style.width=width*scale+'px';wrap.style.height=700*scale+'px'}
function jump(){const d=frame.contentDocument;const s=document.getElementById('section').value;if(s==='top')frame.contentWindow.scrollTo(0,0);else d.querySelector(s)?.scrollIntoView({block:'start'});}
async function load(){const p=document.getElementById('page').value;let html;if(fixtures[p]){const b=Uint8Array.from(atob(fixtures[p]),c=>c.charCodeAt(0));html=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}else{const res=await fetch(p);if(!res.ok)throw Error('HTTP '+res.status);html=await res.text()}if(document.getElementById('nojs').checked)html=html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'');html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+location.origin+(p.startsWith('/')?p:'/')+'">');frame.srcdoc=html;report.textContent='Loading selected page…';}
frame.addEventListener('load',async()=>{fit();frame.contentDocument.querySelectorAll('img').forEach(i=>i.loading='eager');await frame.contentDocument.fonts.ready;jump();report.textContent='Ready. Show section or inspect layout.'});
document.getElementById('load').onclick=()=>load().catch(e=>report.textContent=e.message);document.getElementById('jump').onclick=jump;document.getElementById('width').onchange=()=>{fit();jump()};document.getElementById('inspect').onclick=()=>{
 const d=frame.contentDocument,win=frame.contentWindow;const records=[...d.querySelectorAll('[data-library-record]')].filter(e=>!e.hidden);const overlaps=[];
 for(const [i,e] of records.entries()){const title=e.querySelector('h2').getBoundingClientRect(),action=e.querySelector('.library-record-link').getBoundingClientRect(),rail=e.querySelector('.library-visual-rail');if(title.right>action.left+1)overlaps.push(i);if(rail&&win.getComputedStyle(rail).display!=='none'&&rail.getBoundingClientRect().right>title.left+1)overlaps.push(i);}
