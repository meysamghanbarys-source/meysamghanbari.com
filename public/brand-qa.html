const frame=document.getElementById('frame'),wrap=document.getElementById('wrap'),report=document.getElementById('report');
function fit(){const width=+document.getElementById('width').value;frame.style.width=width+'px';const scale=Math.min(1,(window.innerWidth-40)/width);frame.style.transform='scale('+scale+')';wrap.style.width=width*scale+'px';const height=Math.max(850,frame.contentDocument?.documentElement.scrollHeight||850);frame.style.height=height+'px';wrap.style.height=height*scale+'px'}
let observer;
frame.addEventListener('load',()=>{observer?.disconnect();observer=new ResizeObserver(fit);observer.observe(frame.contentDocument.body);fit();report.textContent='Loaded. Inspect layout or run accessibility check.'});
async function load(){let page=document.getElementById('page').value;let html;if(fixtures[page]){const bytes=Uint8Array.from(atob(fixtures[page]),c=>c.charCodeAt(0));html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}else{const response=await fetch(page);if(!response.ok)throw new Error('Page HTTP '+response.status);html=await response.text()}if(document.getElementById('nojs').checked)html=html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'');html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+location.origin+(page.startsWith('/')?page:'/')+'">');frame.style.height='850px';frame.srcdoc=html;report.textContent='Loading…';fit()}
document.getElementById('load').onclick=()=>load().catch(e=>report.textContent=e.message);
document.getElementById('width').onchange=fit;window.onresize=fit;
document.getElementById('inspect').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow;const rows=[...d.querySelectorAll('[data-library-record]')];report.textContent=JSON.stringify({page:document.getElementById('page').value,width:d.documentElement.clientWidth,documentWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth+1,brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),heading:d.querySelector('h1')?.textContent,visibleRecords:rows.filter(r=>!r.hidden).length,totalRecords:rows.length,libraryStatus:d.querySelector('[data-library-count]')?.textContent,desktopNavVisible:w.getComputedStyle(d.querySelector('.brand-desktop-nav')).display!=='none',portrait:d.querySelector('.brand-portrait img')?.getBoundingClientRect().toJSON()},null,2)};
document.getElementById('axe').onclick=async()=>{try{const w=frame.contentWindow,d=frame.contentDocument;if(!w.axe){await new Promise((resolve,reject)=>{let s=d.createElement('script');s.src='https://cdn.jsdelivr.net/npm/axe-core@4.13.0/axe.min.js';s.onload=resolve;s.onerror=reject;d.head.appendChild(s)})}const result=await w.axe.run(d,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa']}});report.textContent=JSON.stringify({page:document.getElementById('page').value,passes:result.passes.length,violations:result.violations.map(v=>({id:v.id,impact:v.impact,description:v.description,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),incomplete:result.incomplete.map(v=>v.id)},null,2)}catch(e){report.textContent='Accessibility checker unavailable: '+e}};
load().catch(e=>report.textContent=e.message);
